{% extends 'reservas/base.html' %}

{% block content %}
<div class="card" style="max-width:700px; margin:0 auto;">
    <h2>Publicar una reserva para cesión / reventa</h2>
    <p style="color:#475569;">Si no vas a poder utilizar tu billete, publícalo indicando el vuelo y el precio al que lo cedes.</p>

    <form method="post" action="{% url 'publicar_reserva' %}">
        {% csrf_token %}

        <div style="margin-bottom:14px;">
            <label style="font-weight:600; font-size:0.9rem;">1. Selecciona el vuelo (o elige crear uno nuevo)</label>
            <select name="vuelo_id" id="selectorVuelo" onchange="mostrarCamposVuelo()" style="margin-top:4px;">
                <option value="nuevo">-- Crear un vuelo nuevo --</option>
                {% for v in vuelos %}
                    <option value="{{ v.id }}">
                        {{ v.codigo_vuelo }} ({{ v.aerolinea }}) · {{ v.origen }} &rarr; {{ v.destino }} · {{ v.fecha_salida|date:"d/m/Y H:i" }} (Orig: {{ v.precio_original }}€ | Cambio: {{ v.precio_cambio_nombre }}€)
                    </option>
                {% endfor %}
            </select>
        </div>

        <div id="bloqueVueloNuevo" style="background:#f8fafc; padding:16px; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:16px;">
            <h3 style="font-size:1rem; margin-bottom:10px;">Datos del nuevo vuelo</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div>
                    <label style="font-size:0.85rem;">Código de Vuelo (ej: IB3120)</label>
                    <input type="text" name="codigo_vuelo" placeholder="IB3120">
                </div>
                <div>
                    <label style="font-size:0.85rem;">Aerolínea (ej: Iberia, Ryanair)</label>
                    <input type="text" name="aerolinea" placeholder="Iberia">
                </div>
                <div>
                    <label style="font-size:0.85rem;">Ciudad de Origen</label>
                    <input type="text" name="origen" placeholder="Sevilla">
                </div>
                <div>
                    <label style="font-size:0.85rem;">Ciudad de Destino</label>
                    <input type="text" name="destino" placeholder="Roma">
                </div>
                <div>
                    <label style="font-size:0.85rem;">Fecha y Hora de Salida</label>
                    <input type="datetime-local" name="fecha_salida" value="2026-12-15T10:30">
                </div>
                <div>
                    <label style="font-size:0.85rem;">Precio original del vuelo (€)</label>
                    <input type="number" step="0.01" name="precio_original" placeholder="140.00">
                </div>
                <div style="grid-column: span 2;">
                    <label style="font-size:0.85rem;">Tasa de cambio de nombre/sitio de la aerolínea (€)</label>
                    <input type="number" step="0.01" name="precio_cambio_nombre" placeholder="30.00">
                </div>
            </div>
        </div>

        <div style="background:#f8fafc; padding:16px; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:16px;">
            <h3 style="font-size:1rem; margin-bottom:10px;">2. Datos de tu billete / reserva</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
                <div>
                    <label style="font-size:0.85rem;">Código Localizador</label>
                    <input type="text" name="localizador" placeholder="LOC-550A" required>
                </div>
                <div>
                    <label style="font-size:0.85rem;">Asiento</label>
                    <input type="text" name="asiento" placeholder="12C" required>
                </div>
                <div>
                    <label style="font-size:0.85rem;">Precio de cesión que pides (€)</label>
                    <input type="number" step="0.01" name="precio_cesion" placeholder="65.00" required>
                </div>
            </div>
        </div>

        <button type="submit" class="btn" style="width:100%; padding:10px;">Publicar reserva en FlySwap</button>
    </form>
</div>

<script>
function mostrarCamposVuelo() {
    var sel = document.getElementById('selectorVuelo').value;
    var bloque = document.getElementById('bloqueVueloNuevo');
    bloque.style.display = (sel === 'nuevo') ? 'block' : 'none';
}
</script>
{% endblock %}
